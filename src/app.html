<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="theme-color" id="theme-meta" content="#B90F22" />
		<script nonce="%sveltekit.nonce%">
			(() => {
				const themeColorMeta = document.getElementById('theme-meta');
				if (!themeColorMeta) {
					return;
				}

				const browserThemeColorStorageKey = 'playims:theme-color';
				const currentThemeStorageKey = 'playims:current-theme';
				const currentThemeCookieName = 'playims-current-theme=';
				const fallbackColor = '#B90F22';

				const parseColor = (value) => {
					if (!value) {
						return null;
					}

					const normalized = value.replace('#', '').toUpperCase();
					return /^[0-9A-F]{6}$/.test(normalized) ? `#${normalized}` : null;
				};

				const deriveBrowserThemeColor = (value) => {
					const parsed = parseColor(value);
					if (!parsed) {
						return null;
					}

					const cleanHex = parsed.slice(1);
					const mixChannelWithBlack = (start, end) => {
						const channel = parseInt(cleanHex.slice(start, end), 16);
						return Math.round(channel * 0.9)
							.toString(16)
							.padStart(2, '0');
					};

					return `#${(
						mixChannelWithBlack(0, 2) +
						mixChannelWithBlack(2, 4) +
						mixChannelWithBlack(4, 6)
					).toUpperCase()}`;
				};

				const parseThemePayload = (value) => {
					if (!value) {
						return null;
					}

					try {
						const parsed = JSON.parse(decodeURIComponent(value));
						return deriveBrowserThemeColor(
							typeof parsed?.primary === 'string' ? parsed.primary : null
						);
					} catch {
						return null;
					}
				};

				const readFromStorage = (key) => {
					try {
						return window.localStorage.getItem(key) ?? window.sessionStorage.getItem(key);
					} catch {
						return null;
					}
				};

				const cookieValue = document.cookie
					.split('; ')
					.find((entry) => entry.startsWith(currentThemeCookieName))
					?.slice(currentThemeCookieName.length);

				const resolvedThemeColor =
					parseColor(readFromStorage(browserThemeColorStorageKey)) ??
					parseThemePayload(readFromStorage(currentThemeStorageKey)) ??
					parseThemePayload(cookieValue) ??
					fallbackColor;

				if (themeColorMeta.getAttribute('content') !== resolvedThemeColor) {
					themeColorMeta.setAttribute('content', resolvedThemeColor);
				}
			})();
		</script>
		<link rel="manifest" href="/manifest.json" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Bitter:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap"
			rel="stylesheet"
		/>
		<style nonce="%sveltekit.nonce%">
			body {
				visibility: hidden;
			}
			body.theme-ready {
				visibility: visible;
			}
			body:not(.theme-ready) *,
			body:not(.theme-ready) *::before,
			body:not(.theme-ready) *::after {
				transition: none !important;
				animation: none !important;
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
